<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="60" height="72">
  <!-- Corps blanc -->
  <ellipse cx="50" cy="75" rx="18" ry="22" fill="white" stroke="#ddd" stroke-width="1"/>
  <!-- Aile gauche -->
  <ellipse cx="32" cy="78" rx="10" ry="6" fill="#e8e8e8" transform="rotate(-20 32 78)"/>
  <!-- Aile droite -->
  <ellipse cx="68" cy="78" rx="10" ry="6" fill="#e8e8e8" transform="rotate(20 68 78)"/>
  <!-- Plumes noires ailes -->
  <ellipse cx="26" cy="81" rx="7" ry="4" fill="#222" transform="rotate(-25 26 81)"/>
  <ellipse cx="74" cy="81" rx="7" ry="4" fill="#222" transform="rotate(25 74 81)"/>
  <!-- Cou -->
  <rect x="44" y="52" width="12" height="18" rx="6" fill="white"/>
  <!-- Tête -->
  <circle cx="50" cy="46" r="14" fill="white" stroke="#ddd" stroke-width="1"/>
  <!-- Oeil gauche -->
  <circle cx="44" cy="43" r="3" fill="#222"/>
  <circle cx="45" cy="42" r="1" fill="white"/>
  <!-- Oeil droit -->
  <circle cx="56" cy="43" r="3" fill="#222"/>
  <circle cx="57" cy="42" r="1" fill="white"/>
  <!-- Bec -->
  <polygon points="50,48 35,52 50,56" fill="#FF6B00"/>
  <!-- Joues roses -->
  <circle cx="42" cy="48" r="3" fill="#FFB6C1" opacity="0.6"/>
  <circle cx="58" cy="48" r="3" fill="#FFB6C1" opacity="0.6"/>
  <!-- Casquette pilote -->
  <ellipse cx="50" cy="34" rx="16" ry="5" fill="#7B2FBE"/>
  <rect x="34" y="28" width="32" height="10" rx="5" fill="#7B2FBE"/>
  <!-- Visière casquette -->
  <ellipse cx="50" cy="38" rx="18" ry="4" fill="#5B2D8E"/>
  <!-- Lunettes pilote -->
  <circle cx="43" cy="43" r="5" fill="none" stroke="#8B6914" stroke-width="2"/>
  <circle cx="57" cy="43" r="5" fill="none" stroke="#8B6914" stroke-width="2"/>
  <line x1="48" y1="43" x2="52" y2="43" stroke="#8B6914" stroke-width="2"/>
  <!-- Badge sur casquette -->
  <circle cx="50" cy="31" r="3" fill="#FFD700"/>
  <text x="50" y="33" text-anchor="middle" font-size="4" fill="#7B2FBE" font-weight="bold">✈</text>
  <!-- Pattes -->
  <line x1="44" y1="96" x2="40" y2="108" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="96" x2="60" y2="108" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
  <!-- Pieds -->
  <line x1="40" y1="108" x2="34" y2="110" stroke="#FF6B00" stroke-width="2"/>
  <line x1="40" y1="108" x2="40" y2="112" stroke="#FF6B00" stroke-width="2"/>
  <line x1="60" y1="108" x2="66" y2="110" stroke="#FF6B00" stroke-width="2"/>
  <line x1="60" y1="108" x2="60" y2="112" stroke="#FF6B00" stroke-width="2"/>
</svg>
